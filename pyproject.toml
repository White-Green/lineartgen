[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lineartgen"
version = "0.2.0"
description = "Editable JAX lineart diffusion training and ONNX export"
requires-python = ">=3.12"
dependencies = [
  "jax>=0.8.1,<0.12",
  "flax>=0.12.1,<0.14",
  "optax>=0.2.4,<0.3",
  "orbax-checkpoint>=0.11.6,<0.11.37",
  "grain>=0.2,<0.3",
  "numpy>=1.26,<3",
  "pillow>=11,<13",
  "pyvips[binary]>=3,<4",
  "pydantic>=2.10,<3",
  "rich>=13,<15",
  "tensorboardX>=2.6,<3",
  "lineartgen-runtime",
]

[project.optional-dependencies]
export = ["jax2onnx>=0.12,<0.17", "onnx>=1.20,<2", "onnxruntime>=1.24,<2", "msgpack>=1,<2"]
rocm = [
  "jax==0.11.1", "jaxlib==0.11.1",
  "jax-rocm7-plugin==0.11.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.16"]

[project.scripts]
lineartgen = "lineartgen.cli:main"

[tool.uv.sources]
lineartgen-runtime = { path = "packages/lineartgen-runtime", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
