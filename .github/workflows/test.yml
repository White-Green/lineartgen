name: JAX and ONNX
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra export
      - run: uv run --frozen --extra export ruff check .
      - run: uv run --frozen --extra export ruff format --check .
      - run: uv run --frozen --extra export pytest -q
      - run: uv build --project packages/lineartgen-runtime --wheel
