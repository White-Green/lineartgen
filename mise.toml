[tools]
ruby = "4.0"

[env]
COMFYUI_API_HOST = "localhost"
COMFYUI_API_PORT = "8188"
COMFYUI_ROOT_DIR = "/home/whitegreen/ComfyUI"

[tasks."dataset:gen1"]
depends = ["dataset:gen:prepare"]
run = "mise run dataset:gen1:body"

[tasks."dataset:gen2"]
depends = ["dataset:gen:prepare"]
run = "mise run dataset:gen2:body"

[tasks."dataset:gen3"]
depends = ["dataset:gen3:prepare"]
run = "ruby dataset/gen3.rb all"

[tasks."dataset:gen3:2x"]
depends = ["dataset:gen3:prepare"]
run = "ruby dataset/gen3.rb 2x"

[tasks."dataset:gen3:4x"]
depends = ["dataset:gen3:prepare"]
run = "ruby dataset/gen3.rb 4x"

[tasks."dataset:gen3:8x"]
depends = ["dataset:gen3:prepare"]
run = "ruby dataset/gen3.rb 8x"

[tasks."dataset:gen3:16x"]
depends = ["dataset:gen3:prepare"]
run = "ruby dataset/gen3.rb 16x"

[tasks."dataset:gen3:32x"]
depends = ["dataset:gen3:prepare"]
run = "ruby dataset/gen3.rb 32x"

[tasks."dataset:gen3:64x"]
depends = ["dataset:gen3:prepare"]
run = "ruby dataset/gen3.rb 64x"

[tasks."dataset:gen3:prepare"]
run = """
#!/usr/bin/env bash
set -euo pipefail

MODEL_DIR="${COMFYUI_ROOT_DIR}/models/upscale_models"
mkdir -p "${MODEL_DIR}"

fetch_model() {
    local filename="$1"
    local url="$2"
    local expected_sha256="$3"
    local destination="${MODEL_DIR}/${filename}"
    local temporary="${destination}.tmp"

    if [[ -f "${destination}" ]] && echo "${expected_sha256}  ${destination}" | sha256sum --check --status; then
        return
    fi

    rm -f "${temporary}"
    curl --fail --location --output "${temporary}" "${url}"
    echo "${expected_sha256}  ${temporary}" | sha256sum --check --status
    mv "${temporary}" "${destination}"
}

fetch_model \
    "001_classicalSR_DIV2K_s48w8_SwinIR-M_x2.pth" \
    "https://github.com/JingyunLiang/SwinIR/releases/download/v0.0/001_classicalSR_DIV2K_s48w8_SwinIR-M_x2.pth" \
    "ac6d4895f73aa1b3d563937e29dcedcfdff4d401280e248f23db3c6f68e8343b"

fetch_model \
    "001_classicalSR_DIV2K_s48w8_SwinIR-M_x4.pth" \
    "https://github.com/JingyunLiang/SwinIR/releases/download/v0.0/001_classicalSR_DIV2K_s48w8_SwinIR-M_x4.pth" \
    "129dc773ba2d4c07f3eb0bb116fbe692011b7cc072d9ca12797cd3748198610a"

fetch_model \
    "001_classicalSR_DIV2K_s48w8_SwinIR-M_x8.pth" \
    "https://github.com/JingyunLiang/SwinIR/releases/download/v0.0/001_classicalSR_DIV2K_s48w8_SwinIR-M_x8.pth" \
    "3c3ae9238a7125e52aab457df052aa8981adb2fb8e42b6d4112a96b3c19432d7"
"""

[tasks."dataset:gen1:body"]
run = "ruby dataset/gen1.rb"

[tasks."dataset:gen2:body"]
run = "ruby dataset/gen2.rb"

[tasks."dataset:gen:prepare"]
depends = ["dataset:gen:check-precondition"]

[tasks."dataset:gen:check-precondition"]
depends = ["dataset:gen:check-precondition:*"]

[tasks."dataset:gen:check-precondition:flux2-klein"]
run = """
#!/usr/bin/env bash
set -euo pipefail

test $(cut -d ' ' -f 1 <(sha256sum ${COMFYUI_ROOT_DIR}/models/diffusion_models/flux-2-klein-4b.safetensors)) = "ec3d4e733a771f61c052fb4856c48b336c55eaf2c65487c2a1faeb9bbda7a343"
"""

[tasks."dataset:gen:check-precondition:qwen"]
run = """
#!/usr/bin/env bash
set -euo pipefail

test $(cut -d ' ' -f 1 <(sha256sum ${COMFYUI_ROOT_DIR}/models/text_encoders/qwen_3_4b.safetensors)) = "6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a"
"""

[tasks."dataset:gen:check-precondition:flux2-vae"]
run = """
#!/usr/bin/env bash
set -euo pipefail

test $(cut -d ' ' -f 1 <(sha256sum ${COMFYUI_ROOT_DIR}/models/vae/flux2-vae.safetensors)) = "d64f3a68e1cc4f9f4e29b6e0da38a0204fe9a49f2d4053f0ec1fa1ca02f9c4b5"
"""

[tasks."dataset:gen:interrupt"]
run = """
#!/usr/bin/env bash
set -euo pipefail

COMFYUI="http://${COMFYUI_API_HOST}:${COMFYUI_API_PORT}"
curl ${COMFYUI}/api/queue | jq '.queue_pending[][1]' | xargs -iXXX curl -XPOST --data '{"delete":["XXX"]}' ${COMFYUI}/api/queue
"""

[tasks."dataset:recalc_seed1"]
run = "ruby dataset/recalc_seed.rb 1"

[tasks."dataset:recalc_seed2"]
run = "ruby dataset/recalc_seed.rb 2"
